services:
  server1:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ai_server_1
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=50051
      - API_KEY=my-secret-key
    expose:
      - "50051"

  server2:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ai_server_2
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=50051
      - API_KEY=my-secret-key
    expose:
      - "50051"

  server3:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ai_server_3
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=50051
      - API_KEY=my-secret-key
    expose:
      - "50051"

  nginx:
    image: nginx:latest
    container_name: grpc_nginx_lb
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3
